name: Type Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: pip install .

      - name: Install ty
        run: pip install ty

      - name: Run type check
        run: just type-check
